<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        
        <title>components - sandbox</title>
        <link rel="stylesheet" href="src/styles/main.css">
        <link rel="stylesheet" href="src/styles/styles.css">
    </head>
        
    <body>
        <header>
            <h1>Components</h1>
        </header>
        <main>
            <section class="botones--iconos">
                <div class="grid">
                    <input type="text" class="input input--size-medium input--default" placeholder="Nombre" required></input>
                    <input type="text" class="input input--size-large input--default" placeholder="Apellido" required></input>
                    <input type="text" class="input input--size-medium input--secondary" placeholder="Correo electrónico" required></input>
                    <textarea class="input input--default" placeholder="Mensaje" required></textarea>
                </div>
                <div class="grid columns">
                    <article class="card__container card--size-horizontal">
                        <div class="card card--default" style="background-image: url('src/assets/image/img-01.jpeg');">
                            <div class="card__meta">
                                <h4>Neón City</h4>
                                <p>Una serie sobre detectives en una megaciudad futurista.</p>
                            </div>
                        </div>
                    </article>
                    <article class="card__container card--size-vertical">
                        <div class="card card--default" style="background-image: url('src/assets/image/img-01.jpeg');">
                            <div class="card__meta">
                                <h4>Neón City</h4>
                                <p>Una serie sobre detectives en una megaciudad futurista.</p>
                            </div>
                        </div>
                    </article>
                    <article class="card__container card--size-vertical-small">
                        <div class="card card--default" style="background-image: url('src/assets/image/img-01.jpeg');">
                            <div class="card__meta">
                                <h4>Neón City</h4>
                                <p>Una serie sobre detectives en una megaciudad futurista.</p>
                            </div>
                        </div>
                    </article>
                </div>
                <div class="grid columns">
                    <button class="btn btn--size-default btn--default">Empezar</button>
                    <button class="btn btn--size-default btn--secondary">Empezar</button>
                    <button class="btn btn--size-default btn--ghost">Empezar</button>
                    <button class="btn btn--size-default btn--danger">Empezar</button>
                    <button class="btn btn--size-default btn--success">Empezar</button>
                </div>
                <div class="grid">
                    <div class="icons__container">
                        <button class="btn btn--type-square btn--type-square-small btn--default">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title xmlns="">account-circle</title><path fill="currentColor" d="M5.85 17.1q1.275-.975 2.85-1.537T12 15t3.3.563t2.85 1.537q.875-1.025 1.363-2.325T20 12q0-3.325-2.337-5.663T12 4T6.337 6.338T4 12q0 1.475.488 2.775T5.85 17.1m3.663-5.113Q8.5 10.976 8.5 9.5t1.013-2.488T12 6t2.488 1.013T15.5 9.5t-1.012 2.488T12 13t-2.488-1.012M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/></svg>
                        </button>
                        <button class="btn btn--type-square btn--type-square-medium btn--secondary">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><title xmlns="">account-circle</title><path fill="currentColor" d="M5.85 17.1q1.275-.975 2.85-1.537T12 15t3.3.563t2.85 1.537q.875-1.025 1.363-2.325T20 12q0-3.325-2.337-5.663T12 4T6.337 6.338T4 12q0 1.475.488 2.775T5.85 17.1m3.663-5.113Q8.5 10.976 8.5 9.5t1.013-2.488T12 6t2.488 1.013T15.5 9.5t-1.012 2.488T12 13t-2.488-1.012M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/></svg>
                        </button>
                    </div>
                </div>
            </section>
        </main>
        
        <footer>
            <p>©Drive</p>
        </footer>
        
    </body>
</html>
